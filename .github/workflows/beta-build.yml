name: Deploy to Beta

on:
  push:
    branches:
      - updates
  workflow_dispatch:

# Allow only one concurrent deployment
concurrency:
  group: "deploy-beta"
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4
        with:
          ref: updates

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: Build
        run: npm i

      - name: Build
        working-directory: Build
        run: npm run build

      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          repository: HTMLToolkit/beta
          path: beta
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Clear and copy build to subfolder
        run: |
          rm -rf beta/HTMLPlayerBeta/*
          cp -r Build/dist/* beta/HTMLPlayerBeta/

      - name: Commit and push changes
        run: |
          cd beta
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add HTMLPlayerBeta
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy HTMLPlayer build from updates branch"
            git push origin main
          fi
